name: Release

# Every push to main (i.e. every merged PR) builds AppNTFS, tags the repo
# with the next patch version, and publishes a GitHub Release with the
# zipped .app attached. See README's "Distribución" section for the
# code-signing caveats — this pipeline uses a free/personal-team certificate
# (no Developer ID, no notarization), so first-run Gatekeeper approval is
# still manual for whoever installs it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      # Build-time only: Scripts/embed-ntfs-3g.sh copies these binaries out of
      # the keg and into the app bundle, so the published app carries its own
      # copy and users never install this tap. The runner image doesn't have
      # it, and without this step the embed script takes its fallback branch
      # and the release ships without them.
      - name: Install ntfs-3g (embedded into the app at build time)
        run: |
          # The formula carries a fatal `MacfuseRequirement` that checks for
          # /usr/local/include/fuse.h, so the cask has to be installed even
          # though the runner never mounts anything. Nothing is loaded here —
          # only the headers matter — so no kext approval is involved.
          brew install --cask macfuse
          brew tap gromgit/homebrew-fuse
          # Homebrew 6.0 refuses to load formulae from third-party taps until
          # they are explicitly trusted ("Refusing to load formula ... from
          # untrusted tap"). Trusting the single formula we install rather than
          # the whole tap (`brew trust gromgit/fuse`) keeps the other 35 out of
          # it. Runs after the tap, since the name has to resolve.
          brew trust --formula gromgit/fuse/ntfs-3g-mac
          brew install ntfs-3g-mac

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Determine next version
        id: version
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v*' | sort -V | tail -n1)"
          if [ -z "${latest}" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "plainVersion=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next}"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12}" ]; then
            echo "::error::Missing MACOS_CERTIFICATE_P12 secret — export your signing certificate (see README's 'Distribución' section) and add it, MACOS_CERTIFICATE_PASSWORD and KEYCHAIN_PASSWORD as repo secrets."
            exit 1
          fi
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security import "${RUNNER_TEMP}/certificate.p12" -k build.keychain \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          rm -f "${RUNNER_TEMP}/certificate.p12"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project AppNTFS.xcodeproj \
            -scheme AppNTFS \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.plainVersion }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            REQUIRE_EMBEDDED_NTFS3G=1 \
            build

      - name: Sign app and helper
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "${SIGNING_IDENTITY}" ]; then
            echo "::error::Missing MACOS_SIGNING_IDENTITY secret — the exact certificate name, e.g. 'Apple Development: you@example.com (TEAMID)'. Find it with: security find-identity -v -p codesigning"
            exit 1
          fi
          APP="build/Build/Products/Release/AppNTFS.app"
          # Inner-to-outer throughout: a nested signature has to be final
          # before whatever seals it is signed, or the outer seal records a
          # digest that no longer matches.
          #
          # The embedded ntfs-3g binaries come first. Scripts/embed-ntfs-3g.sh
          # already signed them during the build, but that build ran with
          # CODE_SIGNING_ALLOWED=NO, so it fell back to an ad-hoc signature
          # with no Team ID and no hardened runtime. Re-sign them here with the
          # real identity — dylibs before the executables that load them, so
          # library validation sees matching Team IDs on both sides.
          for library in "${APP}/Contents/Frameworks/"*.dylib; do
            [ -f "${library}" ] || continue
            codesign --force --options runtime --timestamp \
              --sign "${SIGNING_IDENTITY}" "${library}"
          done
          for binary in "${APP}/Contents/Helpers/"*; do
            [ -f "${binary}" ] || continue
            codesign --force --options runtime --timestamp \
              --sign "${SIGNING_IDENTITY}" "${binary}"
          done
          # Then the helper tool, before the app bundle that embeds it (see
          # AppNTFSHelper/HelperListenerDelegate's code-signature check — this
          # signature is what it validates).
          codesign --force --options runtime --timestamp \
            --sign "${SIGNING_IDENTITY}" \
            "${APP}/Contents/MacOS/AppNTFSHelper"
          codesign --force --options runtime --timestamp \
            --sign "${SIGNING_IDENTITY}" \
            "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      # The embed step degrades to a warning on a developer's machine, and the
      # app degrades to "ask the user for Homebrew" at runtime — so a release
      # missing these binaries would build, sign, verify and publish without a
      # single red mark. Assert on the actual artifact instead.
      - name: Verify ntfs-3g was embedded
        run: |
          APP="build/Build/Products/Release/AppNTFS.app"
          for binary in ntfs-3g ntfs-3g.probe ntfsfix; do
            if [ ! -x "${APP}/Contents/Helpers/${binary}" ]; then
              echo "::error::${binary} is missing from the built app — the embed step did not run."
              exit 1
            fi
          done
          # GPLv2 obligation: the licence texts have to ship with the binaries.
          for licence in COPYING COPYING.LIB README.txt; do
            if [ ! -f "${APP}/Contents/Resources/ntfs-3g/${licence}" ]; then
              echo "::error::Resources/ntfs-3g/${licence} is missing — the binaries cannot be redistributed without it."
              exit 1
            fi
          done
          # A load command still pointing at the build machine's Homebrew is a
          # binary that fails to launch on any other Mac.
          if otool -L "${APP}/Contents/Helpers/"* \
             | grep -E '^\s+(/opt/homebrew|/usr/local)/(opt|Cellar)/'; then
            echo "::error::An embedded binary still links against the build machine's Homebrew."
            exit 1
          fi
          echo "Embedded ntfs-3g verified:"
          otool -L "${APP}/Contents/Helpers/ntfs-3g"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/AppNTFS.app" \
            AppNTFS.zip

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" AppNTFS.zip \
            --title "AppNTFS ${VERSION}" \
            --notes "⚠️ Build sin notarizar (cuenta de desarrollador gratuita, sin Developer ID). Al abrirlo por primera vez macOS puede avisar que es de un desarrollador no identificado — clic derecho → Abrir, o \`xattr -dr com.apple.quarantine AppNTFS.app\` después de descomprimir."
